name: Android verification
on:
  push:
    branches: [main, improve/timeline-wheel-motion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and run regression tests
        run: bash gradlew --no-daemon --max-workers=2 :core:test :app:testPersonalEnhancedDebugUnitTest :app:assemblePersonalEnhancedDebug --stacktrace
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
