name: Performance profile journeys
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'benchmark/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/performance-profiles.yml'
permissions:
  contents: read
concurrency:
  group: performance-profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture startup and interaction profiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --no-parallel --max-workers=1 -Pwo.benchmarks=true -Pwo.profileGeneration=true :benchmark:connectedPersonalOfflineBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.personal.wo.benchmark.BaselineProfileGenerator
      - name: Import collected app rules
        run: python3 scripts/import_profiles.py benchmark/build/outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wo-performance-profiles
          path: |
            app/src/main/baselineProfiles/baseline-prof.txt
            app/src/main/baselineProfiles/startup-prof.txt
            benchmark/build/outputs/
            benchmark/build/reports/
          if-no-files-found: error
